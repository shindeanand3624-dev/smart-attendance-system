<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | SVM Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="logo">

            <h1>SVM</h1>

            <p>Smart Attendance System</p>

        </div>

        <h2>Forgot Password</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="{{ url_for('forgot_password') }}"
              method="POST">

            <div class="login-type">

                <button type="button"
                        id="studentBtn"
                        class="active"
                        onclick="selectUserType('student')">

                    Student

                </button>

                <button type="button"
                        id="teacherBtn"
                        onclick="selectUserType('teacher')">

                    Teacher

                </button>

            </div>


            <input type="hidden"
                   id="userType"
                   name="user_type"
                   value="student">


            <input type="email"
                   name="email"
                   placeholder="Registered Email"
                   required>


            <input type="password"
                   name="new_password"
                   placeholder="New Password"
                   minlength="6"
                   required>


            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm New Password"
                   minlength="6"
                   required>


            <button type="submit"
                    class="login-btn">

                Reset Password

            </button>

        </form>


        <div class="links">

            <a href="{{ url_for('home') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>


<script>

function selectUserType(type) {

    document.getElementById("userType").value = type;

    const studentBtn =
        document.getElementById("studentBtn");

    const teacherBtn =
        document.getElementById("teacherBtn");


    if (type === "student") {

        studentBtn.classList.add("active");

        teacherBtn.classList.remove("active");

    } else {

        teacherBtn.classList.add("active");

        studentBtn.classList.remove("active");

    }

}

</script>

</body>

</html>
